<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哔哔啵啵 · 把一句话变成小人说话声</title>
<style>
  :root { --ink: #16244A; --yellow: #FFD84D; --red: #FF4D5E; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #FFF6E4 radial-gradient(#E9D9B8 2px, transparent 3px) 0 0 / 28px 28px; color: var(--ink); font: 17px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; place-items: center; padding: 24px; }
  main { width: min(720px, 100%); background: #fff; border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 var(--ink); padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 40px; line-height: 1.2; }
  h1 mark { background: var(--yellow); color: var(--red); border-radius: 10px; padding: 0 8px; }
  p { margin: 6px 0 18px; color: #525C78; }
  textarea { width: 100%; height: 110px; font: inherit; font-size: 22px; padding: 14px; border: 4px solid var(--ink); border-radius: 16px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; }
  label { font-weight: 700; }
  select, input[type=range] { font: inherit; }
  select { padding: 8px 12px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; }
  button { font: inherit; font-weight: 800; font-size: 20px; padding: 10px 26px; border: 4px solid var(--ink); border-radius: 16px; background: var(--yellow); box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button.ghost { background: #fff; }
  canvas { width: 100%; height: 120px; margin-top: 18px; border: 4px solid var(--ink); border-radius: 16px; background: #12173F; display: block; }
  ul { margin: 18px 0 0; padding-left: 20px; color: #525C78; }
  code { background: #F1F3FA; border-radius: 6px; padding: 1px 6px; }
</style>
<main>
  <h1>把一句话变成<mark>哔哔啵啵</mark></h1>
  <p>没有录音，没有 AI 配音。一条锯齿波、两个滤波器，一个字一声。</p>
  <textarea id="text">今天吃白饭？没饭了！真的没饭了……</textarea>
  <div class="row">
    <label>声线 <select id="voice"><option value="fish">大肥鱼（高）</option><option value="lumo">路墨（低）</option></select></label>
    <label>语速 <input id="step" type="range" min="0.08" max="0.3" step="0.01" value="0.13"></label>
    <button id="play">说！</button>
    <button id="save" class="ghost">下载 WAV</button>
  </div>
  <canvas id="scope" width="1328" height="240"></canvas>
  <ul>
    <li>同一个字永远是同一声：音高是 <code>音阶[hash(字) % 音阶长度]</code>。</li>
    <li>问号结尾，尾音往上滑；带感叹号，整句升高；省略号结尾，整句压低、尾音下滑。</li>
    <li>一个汉字一声，一串英文或数字算一声。</li>
  </ul>
</main>
<script type="module">
  // 下面这一段是 bibibobo.js 的原样拷贝（由 node build.mjs 生成），这样双击打开这个文件也能用。
  /* bibibobo:begin */
// bibibobo —— 把一句话变成「哔哔啵啵」的小人说话声。零依赖，浏览器和 Node 都能用。
// 做法只有五步：一条锯齿波 → 两个带通滤波器捏出口型 → 一个字一声（按字算出音高和口型）→ 每个角色一组音阶 → 标点管语气。
// 出自《路墨小剧场》（哈基科技 / Lumoswitch）每期配乐脚本里的同一段代码。MIT 协议。

const TAU = Math.PI * 2;
const mtof = (m) => 440 * 2 ** ((m - 69) / 12); // MIDI 音高 → 频率

/** 五种口型：每种只是两个共振峰频率（Hz）。 */
const VOWELS = [[800, 1200], [400, 2200], [350, 800], [600, 1700], [300, 2600]];

/** 声线：音阶（MIDI 音高）、共振峰倍率、每个字的时长上限、字头小滑音、默认语速。 */
const VOICES = {
  fish: {scale: [76, 79, 81, 83, 84], formant: 1.25, maxDur: 0.13, hold: 0.8, chirp: 1.5, fall: 0, gain: 0.16, step: 0.13}, // 大肥鱼：E5 G5 A5 B5 C6
  lumo: {scale: [62, 64, 67, 69], formant: 0.9, maxDur: 0.2, hold: 0.7, chirp: 0, fall: -2, gain: 0.17, step: 0.16}, // 路墨：D4 E4 G4 A4
};

/** 同一个字永远得到同一个数，所以同一个字永远是同一声。 */
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.codePointAt(0)) % 9973, 7);

/** 一个汉字算一声，一串英文或数字算一声。 */
const syllables = (s) => s.match(/[A-Za-z_\/.0-9]+|[\u4e00-\u9fff]/g) ?? [];

// 抗混叠锯齿波（polyBLEP）
function saw(sampleRate) {
  let ph = 0;
  return (f) => {
    const dt = f / sampleRate;
    ph += dt; if (ph >= 1) ph -= 1;
    let v = 2 * ph - 1;
    if (ph < dt) { const t = ph / dt; v -= t + t - t * t - 1; }
    else if (ph > 1 - dt) { const t = (ph - 1) / dt; v -= t * t + t + t + 1; }
    return v;
  };
}
// 状态变量滤波器，取带通输出
function bandpass(sampleRate) {
  let lp = 0, bp = 0;
  return (x, fc, q) => {
    const f = 2 * Math.sin((Math.PI * Math.min(fc, sampleRate / 6)) / sampleRate);
    const hp = x - lp - bp / q;
    bp += f * hp; lp += f * bp;
    return bp;
  };
}

/** 把一声写进 out：音高 m，时长 dur 秒，glide 是结尾滑多少个半音，vowel 选口型。 */
function voice(out, sampleRate, t, m, dur, v, glide = 0, vowel = 0) {
  const osc = saw(sampleRate), f1 = bandpass(sampleRate), f2 = bandpass(sampleRate);
  const [a, b] = VOWELS[vowel % VOWELS.length];
  const start = Math.floor(t * sampleRate), n = Math.floor(dur * sampleRate);
  for (let i = 0; i < n && start + i < out.length; i++) {
    const x = i / sampleRate;
    const pitch = mtof(m + glide * (x / dur) + v.chirp * Math.exp(-x * 30)) * (1 + 0.012 * Math.sin(TAU * 6 * x)); // 滑音 + 字头小滑音 + 一点颤音
    const s = osc(pitch);
    const env = Math.min(1, x * 200) * Math.min(1, (dur - x) * 40); // 5 毫秒起音，25 毫秒收尾
    out[start + i] += (f1(s, a * v.formant, 4) + 0.7 * f2(s, b * v.formant, 5)) * env * v.gain;
  }
}

/**
 * 把一句话合成为单声道采样（Float32Array，范围 -1..1）。
 * @param {string} text 要说的话。问号结尾尾音上扬；带感叹号整句升高；省略号结尾整句压低、尾音下滑。
 * @param {{voice?: 'fish'|'lumo'|object, step?: number, sampleRate?: number, gap?: number}} [opts]
 *   voice 声线；step 每个字间隔多少秒；gap 句子之间停多少秒。
 */
function synth(text, opts = {}) {
  const v = typeof opts.voice === 'object' ? {...VOICES.fish, ...opts.voice} : VOICES[opts.voice ?? 'fish'];
  const sampleRate = opts.sampleRate ?? 44100, step = opts.step ?? v.step, gap = opts.gap ?? 0.22;
  // 按标点切成句子，每句各自套一条语气规则
  const sentences = (text.match(/[^？?！!。.，,、；;…\n]+[？?！!。.，,、；;…]*/g) ?? []).map((s) => ({text: s, tk: syllables(s)})).filter((s) => s.tk.length);
  const total = sentences.reduce((n, s) => n + s.tk.length * step + gap, 0) + 0.4;
  const out = new Float32Array(Math.ceil(total * sampleRate));
  let t = 0.02;
  for (const {text: s, tk} of sentences) {
    const ask = /[？?]$/.test(s), shout = /[！!]/.test(s), sad = /(……|\.\.\.|…)$/.test(s);
    tk.forEach((w, i) => {
      const last = i === tk.length - 1;
      const m = v.scale[hash(w) % v.scale.length] + (shout ? 3 : 0) - (sad ? 3 : 0);
      const dur = Math.min(step * v.hold, v.maxDur) + (last && (ask || shout || sad) ? 0.1 : 0);
      voice(out, sampleRate, t + i * step, m, dur, v, last && ask ? 5 : last && sad ? -4 : last ? v.fall : 0, hash(w));
    });
    t += tk.length * step + gap;
  }
  for (let i = 0; i < out.length; i++) out[i] = Math.tanh(out[i] * 2.4); // 软限幅，响一点也不破音
  return out;
}

/** 把采样打包成 16 位单声道 WAV 文件内容（Uint8Array）。 */
function toWav(samples, sampleRate = 44100) {
  const buf = new ArrayBuffer(44 + samples.length * 2), d = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); d.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVEfmt ');
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, sampleRate, true); d.setUint32(28, sampleRate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  str(36, 'data'); d.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) d.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, samples[i])) * 32767), true);
  return new Uint8Array(buf);
}
  /* bibibobo:end */
  const $ = (id) => document.getElementById(id);
  let ctx;
  const make = () => synth($('text').value, {voice: $('voice').value, step: +$('step').value});
  function draw(samples) {
    const c = $('scope'), g = c.getContext('2d'), w = c.width, h = c.height;
    g.clearRect(0, 0, w, h); g.strokeStyle = '#7CF5C6'; g.lineWidth = 3; g.beginPath();
    const n = Math.max(1, Math.floor(samples.length / w));
    for (let x = 0; x < w; x++) { let lo = 1, hi = -1; for (let i = x * n; i < (x + 1) * n && i < samples.length; i++) { lo = Math.min(lo, samples[i]); hi = Math.max(hi, samples[i]); } g.moveTo(x, h / 2 - hi * h * 0.46); g.lineTo(x, h / 2 - lo * h * 0.46 + 1); }
    g.stroke();
  }
  $('voice').onchange = () => { $('step').value = VOICES[$('voice').value].step; };
  $('play').onclick = () => {
    const samples = make(); draw(samples);
    ctx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const buf = ctx.createBuffer(1, samples.length, 44100); buf.copyToChannel(samples, 0);
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
  };
  $('save').onclick = () => {
    const samples = make(); draw(samples);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toWav(samples)], {type: 'audio/wav'})); a.download = 'bibibobo.wav'; a.click();
  };
  draw(make());
</script>
</html>
